<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Brand Container -->
  <rect width="64" height="64" rx="14" fill="#083b2e"/>
  
  <!-- Outer subtle gold border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#b1843e" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Right Calligraphy Mark (Arabic Quotes/Brackets) -->
  <path d="M26 14c-8 3.5-11 10.5-11 18s3 14.5 11 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Left Calligraphy Mark -->
  <path d="M38 14c8 3.5 11 10.5 11 18s-3 14.5-11 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Central Copper Dot (The proofreading focus point) -->
  <circle cx="32" cy="32" r="5" fill="#b1843e"/>
  
  <!-- Base Accent Line (The firm baseline) -->
  <path d="M20 54h24" stroke="#b1843e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
